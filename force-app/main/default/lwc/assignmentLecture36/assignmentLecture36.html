<template>
    <lightning-input type="text" label="Enter name" data-field="name" onchange={handleChange}></lightning-input>
    <lightning-input type="number" label="Enter age" data-field="age" onchange={handleChange}></lightning-input>
    <lightning-input type="number" label="Enter roll number" data-field="rollNumber" onchange={handleChange}></lightning-input>
    <br/><br/>
    <lightning-button label="Show Result" onclick={handleSubmit}></lightning-button>
    <br/><br/>
    <template if:true={studentResult}>
        <p>Name: {studentResult.name}</p>
        <p>Age: {studentResult.age}</p>
        <p>Roll Number: {studentResult.rollNumber}</p></template>
    
        <template if:false={studentResult}>
        <p>There is not data in StudentResult object</p>
        
</template>
