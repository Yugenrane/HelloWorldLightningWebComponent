<template>
    <lightning-card title="Student Information">
        <div class="slds-p-around_medium lgc-bg" onclick={tileHandleClick}>
            <lightning-tile label={studentInfo.rollNumber}>
                <p class="slds-truncate" title={studentInfo.name}>{studentInfo.name}</p>
                <p class="slds-truncate" title={studentInfo.age}>{studentInfo.age}</p>
            </lightning-tile>
        </div>
    </lightning-card>
</template>
